[package]
name = "yukun"
version = "0.1.0"
description = "A macOS floating control shell for local AI coding agents."
authors = ["yukun"]
edition = "2021"

[lib]
name = "yukun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
regex = "1"
